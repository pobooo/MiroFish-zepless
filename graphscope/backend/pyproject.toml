[project]
name = "graphscope-backend"
version = "0.1.0"
description = "GraphScope backend - graph analytics and GraphRAG support service"
requires-python = ">=3.11"
authors = [
    { name = "GraphScope" }
]
dependencies = [
    "fastapi>=0.116.0",
    "uvicorn[standard]>=0.35.0",
    "neo4j>=5.26.0",
    "networkx>=3.5",
    "numpy>=2.2.0",
    "scipy>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
