services:
  graphscope-backend:
    build:
      context: ./backend
    container_name: graphscope-backend
    environment:
      - GRAPHSCOPE_NEO4J_URI=${GRAPHSCOPE_NEO4J_URI:-bolt://host.docker.internal:7687}
      - GRAPHSCOPE_NEO4J_USER=${GRAPHSCOPE_NEO4J_USER:-neo4j}
      - GRAPHSCOPE_NEO4J_PASSWORD=${GRAPHSCOPE_NEO4J_PASSWORD:-neo4j}
      - GRAPHSCOPE_DEFAULT_GROUP_ID=${GRAPHSCOPE_DEFAULT_GROUP_ID:-}
      - GRAPHSCOPE_CORS_ORIGINS=["http://localhost:5174","http://localhost:8088"]
    ports:
      - "8008:8008"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  graphscope-frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8008/api
    container_name: graphscope-frontend
    ports:
      - "8088:80"
    depends_on:
      - graphscope-backend
    restart: unless-stopped
