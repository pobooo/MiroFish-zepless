services:
  neo4j:
    image: neo4j:2026-community
    container_name: mirofish-neo4j
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-your_neo4j_password}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    restart: unless-stopped
    healthcheck:
      # 容器内以 console 模式运行，不生成 PID 文件，`neo4j status` 会一直报告未运行
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 60s

  mirofish:
    build: .
    container_name: mirofish
    env_file:
      - .env
    environment:
      - NEO4J_URI=bolt://neo4j:7687
    ports:
      - "3000:3000"
      - "5001:5001"
    restart: unless-stopped
    volumes:
      - ./backend/uploads:/app/backend/uploads
    depends_on:
      neo4j:
        condition: service_healthy

volumes:
  neo4j_data:
  neo4j_logs:
